name: CI

# Corre en cada PR hacia dev/main y en cada push a esas ramas.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  # ── Lint: análisis estático de estilo/errores con Ruff ──────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Ruff
        run: pip install ruff==0.15.18
      - name: Ruff check
        run: ruff check app/ tests/

  # ── Regresión: corre toda la suite pytest (unitaria, humo, integración,
  #    seguridad). Si algún test rompe, el PR queda en rojo. ──────────────────
  tests:
    name: Regresión (pytest)
    runs-on: ubuntu-latest
    # En CI no existe .env: pydantic-settings exige estas variables al importar
    # la app, así que las inyectamos con valores dummy. El JWT_SECRET es el mismo
    # con el que los tests firman y verifican tokens, por lo que basta cualquiera.
    env:
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_JWT_SECRET: test-secret-32-chars-minimum-here
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar suite (regresión)
        run: pytest -q

# Nota: las pruebas de carga (k6, tests/load/) no corren acá porque necesitan
# el servidor levantado; se ejecutan aparte contra un entorno desplegado.
